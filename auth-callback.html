<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elsewhereastro — signing you in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Dark mode: the visitor's saved choice, otherwise their device setting.
(function(){var t=null;try{t=localStorage.getItem('ea_theme');}catch(e){}
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function apply(){var d=t?t==='dark':mq.matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}
  apply();if(mq.addEventListener)mq.addEventListener('change',apply);document.addEventListener('DOMContentLoaded',apply);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1714; --ink-2:#2e2b28; --ink-3:#4a4540;
  --paper:#faf8f4; --paper-2:#f2ede5; --paper-3:#e8e0d2;
  --gold:#8a6a35; --red-d:#8b3a3a;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
}
html[data-theme="dark"]{
  --ink:#f6ecdc;--ink-2:#ead9c0;--ink-3:#cdb999;
  --paper:#1c1712;--paper-2:#272019;--paper-3:#4a3e31;
  --gold:#e0b773;--red-d:#ec9a86;
  color-scheme:dark;
}
html,body{min-height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;line-height:1.55}
.card{width:100%;max-width:360px}
.wordmark{font-family:var(--serif);font-size:18.5px;font-weight:400;letter-spacing:.2em;text-transform:lowercase;color:var(--ink);margin-bottom:2rem}
.wordmark .astro{color:var(--gold)}
.star{color:var(--gold);font-size:1.2rem;margin-bottom:1rem}
.msg{font-family:var(--serif);font-size:1.14rem;font-style:italic;color:var(--ink-3);line-height:1.7;font-weight:500}

/* Shown only when the link didn't work, so the visitor can ask for another
   one from here instead of being bounced away without explanation. */
#retry{display:none;margin-top:1.8rem}
#retry input{font-family:var(--sans);font-size:1.09rem;font-weight:400;color:var(--ink);background:transparent;border:none;border-bottom:.5px solid var(--paper-3);border-radius:0;padding:.7rem 0;min-height:44px;width:100%;outline:none;text-align:center;margin-bottom:1.2rem}
#retry input:focus{border-bottom-color:var(--gold)}
#retry input::placeholder{color:var(--ink-3);font-style:italic;font-family:var(--serif);font-size:0.99rem;font-weight:500}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--ink);border:none;padding:0 2rem;min-height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold)}
.btn:disabled{opacity:.5;cursor:wait}
.back{display:inline-block;margin-top:1.2rem;padding:.8rem .15rem;min-height:44px;font-family:var(--serif);font-size:0.91rem;color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--paper-3);text-underline-offset:3px;font-weight:500}
.note{font-family:var(--serif);font-style:italic;font-size:0.97rem;margin-top:1rem;line-height:1.6;font-weight:500;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">elsewhere<span class="astro">astro</span></div>
  <div class="star">&#10022;</div>
  <p class="msg" id="msg">Signing you in&hellip;</p>

  <div id="retry">
    <input type="email" id="retryEmail" placeholder="your@email.com" autocomplete="email" onkeydown="if(event.key==='Enter'){sendNewLink();}">
    <br>
    <button class="btn" id="retryBtn" onclick="sendNewLink()">Email me a new link</button>
    <p class="note" id="retryNote"></p>
    <br>
    <a class="back" href="/">Back to the map</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = 'https://wdulylmxhvlxhjfmfivu.supabase.co';
var SUPABASE_KEY = 'sb_publishable_pBoHzlLsZiLAr7EYF824DA_R6pw5sdR';
var _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// A sign-in link that didn't work used to bounce the visitor to the map after
// two seconds with no explanation. Now the page says what happened and offers
// to send another one, which is the only thing they can usefully do from here.
function showRetry(message) {
  var msgEl = document.getElementById('msg');
  if (msgEl) msgEl.textContent = message;
  var retry = document.getElementById('retry');
  if (retry) retry.style.display = 'block';
}

function sendNewLink() {
  var input = document.getElementById('retryEmail');
  var note  = document.getElementById('retryNote');
  var btn   = document.getElementById('retryBtn');
  var email = (input.value || '').trim();

  note.style.display = 'none';
  if (!email || email.indexOf('@') === -1) {
    note.textContent = 'Please enter a valid email address.';
    note.style.color = 'var(--red-d)';
    note.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  _sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: 'https://elsewhereastro.com/auth-callback.html' }
  }).then(function (result) {
    if (result.error) {
      note.textContent = 'Error: ' + result.error.message;
      note.style.color = 'var(--red-d)';
      note.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Email me a new link';
      return;
    }
    input.style.display = 'none';
    btn.style.display = 'none';
    note.textContent = 'Check your email for a new sign-in link.';
    note.style.color = 'var(--gold)';
    note.style.display = 'block';
  }).catch(function () {
    note.textContent = 'Something went wrong. Please try again.';
    note.style.color = 'var(--red-d)';
    note.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Email me a new link';
  });
}

async function handleCallback() {
  try {
    var msgEl = document.getElementById('msg');

    // Supabase automatically handles the code exchange from URL params
    // Just call getSession after a brief moment for it to process
    var { data, error } = await _sb.auth.getSession();

    if (error || !data.session) {
      // Try exchanging code manually
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');

      if (code) {
        var result = await _sb.auth.exchangeCodeForSession(code);
        if (result.error) {
          console.error('Exchange error:', result.error);
          showRetry('That sign-in link didn\'t work. It may have expired, or already been used.');
          return;
        }
        data = result.data;
      } else {
        showRetry('That sign-in link didn\'t work. It may have expired, or already been used.');
        return;
      }
    }

    if (!data || !data.session) {
      showRetry('That sign-in link didn\'t work. It may have expired, or already been used.');
      return;
    }

    var user = data.session.user;
    msgEl.textContent = 'You\'re in. Taking you to your chart…';

    // Save minimal user info so index.html can use it immediately
    localStorage.setItem('elsewhere_user', JSON.stringify({
      id: user.id,
      email: user.email
    }));

    // Supabase already saved the full session to localStorage automatically
    // Flag that we should auto-submit on the next page load
    localStorage.setItem('elsewhere_autologin', '1');

    setTimeout(function() { window.location.href = '/profile.html'; }, 1000);

  } catch (err) {
    console.error('Auth callback error:', err);
    showRetry('Something went wrong signing you in.');
  }
}

handleCallback();
</script>
</body>
</html>
