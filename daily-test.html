<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>elsewhere — daily horoscope test</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!--
  daily-test.html — HIDDEN test page for the app's daily horoscope.
  Signed-in testers (DAILY_TESTERS in Vercel) pick a place and a day and see
  the reading the app would send at 8am local time. Remove before launch.
-->
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8f4;color:#1a1714;font-family:'Jost',sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 20px 80px}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;margin:0 0 6px}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:#4a4540;margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:.5px solid #cfc4b0;background:#fff;border-radius:20px;cursor:pointer}
button.on{background:#1a1714;color:#faf8f4;border-color:#1a1714}
button.go{background:#b8955a;color:#fff;border-color:#b8955a;border-radius:0;padding:14px 22px}
button:disabled{opacity:.5;cursor:wait}
input[type=date]{font-family:'Jost',sans-serif;font-size:15px;padding:8px;border:.5px solid #cfc4b0;background:#fff}
.notif{margin:28px 0 16px;padding:14px 16px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);font-size:14px}
.notif b{display:block;font-size:12px;letter-spacing:.08em;color:#8a6a35;margin-bottom:2px}
.card{background:#fff;border:.5px solid #e8e0d2;border-radius:10px;padding:22px}
.place{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#8a6a35}
.head{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:400;margin:6px 0 16px}
.inf{margin:0 0 16px}
.inf .t{font-weight:500;font-size:14px}
.inf .g{display:inline-block;width:22px;font-size:16px;color:#8a6a35}
.inf .tm{margin-left:22px}
.inf .l{font-size:11px;color:#8f8577;letter-spacing:.06em;margin-left:6px}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#2f5d3f;background:#e2eee4;padding:2px 8px;border-radius:10px;margin-left:6px}
.inf .tm{font-size:12px;color:#8a6a35;margin-top:2px}
.inf p{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;margin:4px 0 0 22px;color:#2e2b28}
.sec{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#8a6a35;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:.5px;background:#e8e0d2}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-6px 0 6px}
.gfb{background:#faf6ee;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.gfb b{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8a6a35}
.gfb span{font-size:13px;color:#2e2b28;line-height:1.4}
.err{color:#9b3535;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px}
.meta{font-size:11px;color:#8f8577;margin-top:10px}
.tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:.5px solid #d9cfbd}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 10px 9px;font-size:11px;letter-spacing:.16em;color:#8f8577}
.tab.on{color:#1a1714;background:none;border-color:transparent;border-bottom-color:#b8955a}
.hint{font-family:'Cormorant Garamond',serif;font-style:italic;color:#8f8577;font-size:15px;margin:12px 0 0}
.card{margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>Daily horoscope test</h1>
  <p class="sub">What the app would show you, for any place and day. Today's headline is the 8am notification.</p>
  <div class="row" id="places"></div>
  <div class="row"><input type="date" id="day"><button class="go" id="go">Write the reading</button></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="today">Today</button>
    <button class="tab" data-v="tomorrow">Tomorrow</button>
    <button class="tab" data-v="week">This week</button>
    <button class="tab" data-v="month">This month</button>
  </div>
  <div id="out"><p class="hint">Pick a place and a day, then write the reading. Each tab is written when you open it.</p></div>
</main>
<script>
var SB = supabase.createClient('https://wdulylmxhvlxhjfmfivu.supabase.co', 'sb_publishable_pBoHzlLsZiLAr7EYF824DA_R6pw5sdR');
var PLACES = [
  { name: 'Los Angeles', lat: 34.05, lng: -118.24, zone: 'America/Los_Angeles' },
  { name: 'New York', lat: 40.71, lng: -74.01, zone: 'America/New_York' },
  { name: 'Paris', lat: 48.86, lng: 2.35, zone: 'Europe/Paris' },
  { name: 'London', lat: 51.51, lng: -0.13, zone: 'Europe/London' },
  { name: 'My location', here: true }
];
var chosen = PLACES[0], view = 'today', cache = {}, busy = false;
var G = { Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀', Mars: '♂', Jupiter: '♃', Saturn: '♄', Uranus: '♅', Neptune: '♆', Pluto: '♇' };
var SECTIONS = {
  today:    [['Exact today', true], ['In effect', false]],
  tomorrow: [['Exact tomorrow', true], ['In effect', false]],
  week:     [['Exact this week', true], ['Also in effect', false]],
  month:    [['Exact this month', true], ['Also in effect', false]]
};
var NAMES = { today: 'Today', tomorrow: 'Tomorrow', week: 'This week', month: 'This month' };

document.getElementById('places').innerHTML = PLACES.map(function (p, i) {
  return '<button data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + p.name + '</button>';
}).join('');
document.getElementById('places').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#places button').forEach(function (x) { x.classList.remove('on'); });
  b.classList.add('on'); chosen = PLACES[+b.getAttribute('data-i')]; cache = {};
});
var d = new Date(); document.getElementById('day').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
document.getElementById('day').addEventListener('change', function () { cache = {}; });

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function glyph(f) { var g = G[f.transit]; return '<span class="g" aria-hidden="true">' + (g ? g + '\uFE0E' : '') + '</span>'; }
function here() {
  return new Promise(function (ok, no) {
    navigator.geolocation.getCurrentPosition(function (p) { ok({ name: 'Here', lat: p.coords.latitude, lng: p.coords.longitude, zone: Intl.DateTimeFormat().resolvedOptions().timeZone }); },
      function () { no(new Error('Location was not allowed')); }, { timeout: 10000 });
  });
}
function dayName(iso) {
  var v = iso.split('-').map(Number);
  return new Date(Date.UTC(v[0], v[1] - 1, v[2], 12)).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' });
}

function render(j, p) {
  var R = j.reading, out = document.getElementById('out'), body = '';
  SECTIONS[j.view].forEach(function (s) {
    var items = R.influences.filter(function (f) { return !!f.exact_here === s[1]; });
    if (!items.length) return;
    body += '<div class="sec">' + esc(s[0]) + '</div>';
    items.forEach(function (f) {
      body += '<div class="inf">' + glyph(f) + '<span class="t">' + esc(f.title) + '</span>' +
        (f.only_here ? '<span class="badge">Only here</span>' : '') +
        (f.timing ? '<div class="tm">' + esc(f.timing) + '</div>' : '') + '<p>' + esc(f.text) + '</p></div>';
    });
  });
  out.innerHTML =
    (j.view === 'today' ? '<div class="notif"><b>ELSEWHERE · 8:00</b>' + esc(R.headline) + '</div>' : '') +
    '<div class="card"><div class="place">' + esc(p.name + ' · ' + NAMES[j.view] + (j.view === 'today' || j.view === 'tomorrow' ? ' · ' + dayName(j.date) : '')) + '</div>' +
    '<div class="head">' + esc(R.headline) + '</div>' +
    '<div class="gf"><div class="gfb"><b>Good for</b><span>' + esc(R.good_for) + '</span></div>' +
    '<div class="gfb"><b>Go easy on</b><span>' + esc(R.go_easy_on) + '</span></div></div>' +
    body + '</div>' +
    '<div class="meta">' + esc(j.model) + (j.usage ? ' · ' + j.usage.input_tokens + ' in / ' + j.usage.output_tokens + ' out tokens' : '') +
    (j.house_system && j.house_system !== 'Placidus' ? ' · ' + esc(j.house_system) + ' houses (too far north/south for Placidus)' : '') + '</div>';
}

async function load() {
  if (busy) return;
  var btn = document.getElementById('go'), out = document.getElementById('out');
  if (cache[view]) { render(cache[view].j, cache[view].p); return; }
  busy = true; btn.disabled = true; btn.textContent = 'Writing…';
  out.innerHTML = '<p class="hint">Writing ' + NAMES[view].toLowerCase() + '…</p>';
  try {
    var s = (await SB.auth.getSession()).data.session;
    if (!s) throw new Error('Sign in on elsewhereastro.com first, then come back to this page.');
    var p = chosen.here ? await here() : chosen;
    var r = await fetch('/api/daily-reading', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token },
      body: JSON.stringify({ lat: p.lat, lng: p.lng, place: p.name, zone: p.zone, view: view, date: document.getElementById('day').value }) });
    var j = await r.json();
    if (!r.ok) {
      out.innerHTML = j.raw ? '<pre style="white-space:pre-wrap;font-size:12px;background:#fff;padding:12px;border:.5px solid #e8e0d2">' + esc(j.raw) + '</pre>' : '';
      throw new Error(j.error === 'not_a_tester' ? 'Your email is not in DAILY_TESTERS in Vercel yet.' : (j.message || j.error || ('status ' + r.status)));
    }
    cache[view] = { j: j, p: p };
    render(j, p);
  } catch (e) {
    out.innerHTML = '<p class="err">' + esc(e.message) + '</p>' + out.innerHTML;
  }
  busy = false; btn.disabled = false; btn.textContent = 'Write the reading';
}

document.getElementById('go').addEventListener('click', function () { cache = {}; load(); });
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab'); if (!b || busy) return;
  document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
  b.classList.add('on'); view = b.getAttribute('data-v');
  if (Object.keys(cache).length || document.querySelector('.card')) load();
});
</script>
</body>
</html>
