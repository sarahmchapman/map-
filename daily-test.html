<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>elsewhere — daily horoscope test</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!--
  daily-test.html — HIDDEN test page for the app's daily horoscope.
  Signed-in testers (DAILY_TESTERS in Vercel) pick a place and a day and see
  the reading the app would send at 8am local time. Remove before launch.
-->
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8f4;color:#1a1714;font-family:'Jost',sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 20px 80px}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;margin:0 0 6px}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:#4a4540;margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:.5px solid #cfc4b0;background:#fff;border-radius:20px;cursor:pointer}
button.on{background:#1a1714;color:#faf8f4;border-color:#1a1714}
button.go{background:#b8955a;color:#fff;border-color:#b8955a;border-radius:0;padding:14px 22px}
button:disabled{opacity:.5;cursor:wait}
input[type=date]{font-family:'Jost',sans-serif;font-size:15px;padding:8px;border:.5px solid #cfc4b0;background:#fff}
.notif{margin:28px 0 16px;padding:14px 16px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);font-size:14px}
.notif b{display:block;font-size:12px;letter-spacing:.08em;color:#8a6a35;margin-bottom:2px}
.card{background:#fff;border:.5px solid #e8e0d2;border-radius:10px;padding:22px}
.place{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#8a6a35}
.head{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:400;margin:6px 0 16px}
.inf{margin:0 0 16px}
.inf .t{font-weight:500;font-size:14px}
.inf .l{font-size:11px;color:#8f8577;letter-spacing:.06em;margin-left:6px}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#2f5d3f;background:#e2eee4;padding:2px 8px;border-radius:10px;margin-left:6px}
.inf .tm{font-size:12px;color:#8a6a35;margin-top:2px}
.inf p{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;margin:4px 0 0;color:#2e2b28}
.gf{font-size:13px;color:#4a4540;border-top:.5px solid #e8e0d2;padding-top:12px}
.err{color:#9b3535;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px}
.meta{font-size:11px;color:#8f8577;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Daily horoscope test</h1>
  <p class="sub">What the app would send you at 8am local time, for any place and day.</p>
  <div class="row" id="places"></div>
  <div class="row"><input type="date" id="day"><button class="go" id="go">Write the reading</button></div>
  <div id="out"></div>
</main>
<script>
var SB = supabase.createClient('https://wdulylmxhvlxhjfmfivu.supabase.co', 'sb_publishable_pBoHzlLsZiLAr7EYF824DA_R6pw5sdR');
var PLACES = [
  { name: 'Los Angeles', lat: 34.05, lng: -118.24, zone: 'America/Los_Angeles' },
  { name: 'New York', lat: 40.71, lng: -74.01, zone: 'America/New_York' },
  { name: 'Paris', lat: 48.86, lng: 2.35, zone: 'Europe/Paris' },
  { name: 'London', lat: 51.51, lng: -0.13, zone: 'Europe/London' },
  { name: 'My location', here: true }
];
var chosen = PLACES[0];
document.getElementById('places').innerHTML = PLACES.map(function (p, i) {
  return '<button data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + p.name + '</button>';
}).join('');
document.getElementById('places').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#places button').forEach(function (x) { x.classList.remove('on'); });
  b.classList.add('on'); chosen = PLACES[+b.getAttribute('data-i')];
});
var d = new Date(); document.getElementById('day').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// Offset (hours) of a time zone at a given local wall time.
function zoneOffset(zone, y, mo, dd, h) {
  var fmt = new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  function at(ms) { var p = {}; fmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
    return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute) - Math.floor(ms / 60000) * 60000) / 60000); }
  var wall = Date.UTC(y, mo - 1, dd, h, 0), off = at(wall); off = at(wall - off * 60000); return off / 60;
}
// 8am local on the chosen day, as a Julian Day in world time.
function eightAm(zone) {
  var v = document.getElementById('day').value.split('-').map(Number);
  var off = zoneOffset(zone, v[0], v[1], v[2], 8);
  var ms = Date.UTC(v[0], v[1] - 1, v[2], 8) - off * 3600000;
  return { jd: ms / 86400000 + 2440587.5, tz: off, day: new Date(Date.UTC(v[0], v[1] - 1, v[2], 12)).toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' }) };
}
function here() {
  return new Promise(function (ok, no) {
    navigator.geolocation.getCurrentPosition(function (p) { ok({ name: 'Here', lat: p.coords.latitude, lng: p.coords.longitude, zone: Intl.DateTimeFormat().resolvedOptions().timeZone }); },
      function () { no(new Error('Location was not allowed')); }, { timeout: 10000 });
  });
}

document.getElementById('go').addEventListener('click', async function () {
  var btn = this, out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'Writing…'; out.innerHTML = '';
  try {
    var s = (await SB.auth.getSession()).data.session;
    if (!s) throw new Error('Sign in on elsewhereastro.com first, then come back to this page.');
    var p = chosen.here ? await here() : chosen;
    var t = eightAm(p.zone);
    var r = await fetch('/api/daily-reading', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token },
      body: JSON.stringify({ lat: p.lat, lng: p.lng, place: p.name, day: t.day, at: t.jd, tz: t.tz }) });
    var j = await r.json();
    if (!r.ok) {
      if (j.raw) out.innerHTML = '<pre style="white-space:pre-wrap;font-size:12px;background:#fff;padding:12px;border:.5px solid #e8e0d2">' + esc(j.raw) + '</pre>';
      throw new Error(j.error === 'not_a_tester' ? 'Your email is not in DAILY_TESTERS in Vercel yet.' : (j.error || ('status ' + r.status)));
    }
    var R = j.reading;
    out.innerHTML =
      '<div class="notif"><b>ELSEWHERE · 8:00</b>' + esc(R.headline) + '</div>' +
      '<div class="card"><div class="place">' + esc(p.name + ' · ' + t.day) + '</div><div class="head">' + esc(R.headline) + '</div>' +
      R.influences.map(function (f) {
        return '<div class="inf"><span class="t">' + esc(f.title) + '</span><span class="l">' + esc(f.when || f.lasts) + '</span>' +
          (f.only_here ? '<span class="badge">Only here</span>' : '') +
          (f.timing ? '<div class="tm">' + esc(f.timing) + '</div>' : '') + '<p>' + esc(f.text) + '</p></div>';
      }).join('') +
      '<div class="gf"><b>Good for:</b> ' + esc(R.good_for) + ' · <b>Go easy on:</b> ' + esc(R.go_easy_on) + '</div></div>' +
      '<div class="meta">' + esc(j.model) + (j.usage ? ' · ' + j.usage.input_tokens + ' in / ' + j.usage.output_tokens + ' out tokens' : '') + '</div>';
  } catch (e) {
    out.innerHTML = '<p class="err">' + esc(e.message) + '</p>' + out.innerHTML;
  }
  btn.disabled = false; btn.textContent = 'Write the reading';
});
</script>
</body>
</html>
