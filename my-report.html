<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elsewhere — your report</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!--
  my-report.html — a buyer's Best Places report (Love, Career or Home).
  Open as /my-report.html?theme=love (or career, home).
  The page asks api/generate-report for the report: it checks the buyer is
  signed in and has paid, makes the report the first time (about a minute)
  and loads the saved copy after that. Styled after the approved mockup (Nov 1).
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#1a1714;--ink-2:#2e2b28;--ink-3:#4a4540;--paper:#faf8f4;--paper-2:#f2ede5;--line:#e8e0d2;--gold:#8a6a35;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
a{color:#7a5a24}a:hover{color:var(--ink)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:.5px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1000}
.wordmark{font-family:var(--serif);font-size:17px;font-weight:300;letter-spacing:.35em;color:var(--ink);text-decoration:none}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);text-decoration:none;border:.5px solid #d9cfbd;border-radius:22px}
main{max-width:860px;margin:0 auto;padding:40px 20px 80px;display:flex;flex-direction:column;gap:56px}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 18px;display:inline-flex;align-items:center;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);border:.5px solid #d9cfbd;border-radius:20px;text-decoration:none}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:var(--serif);font-size:clamp(36px,6vw,56px);font-weight:300;line-height:1.05}
h1 em{color:var(--gold)}
.who{margin:0;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-3)}
.lede{margin:8px 0 0;max-width:600px;font-family:var(--serif);font-size:18px;line-height:1.65;color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;gap:14px}
.sec-h h2{margin:0;font-size:10px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.sec-h div{flex:1;height:.5px;background:var(--line)}
.body{margin:0;font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;background:#fff;border:.5px solid var(--line);border-radius:8px}
.card.warm{background:#f6efe0;border-color:#e1d3b5}
.badge{align-self:flex-start;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:10px}
h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:4px 10px;border:.5px solid #d9cfbd;border-radius:14px;background:#fff}
.chip .g{font-size:14px}
.cross{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:14px;border:.5px dashed}
.cross .x{font-size:10px;color:#8f8577}
.cross .t{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
#map{width:100%;height:420px;border:.5px solid #d9cfbd;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%}
.pin{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600;border:1.5px solid var(--paper);font-family:var(--sans)}
.planets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.planet{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--paper-2);border:.5px solid var(--line);border-radius:6px}
.planet .nm{display:flex;align-items:center;gap:10px}
.planet .nm span:last-child{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.planet .pl{font-family:var(--serif);font-size:17px}
.planet .why{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--ink-3)}
.place{display:flex;gap:18px;padding:22px;background:#fff;border:.5px solid var(--line);border-radius:8px}
.rank{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600}
.place .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.place .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.place .ctry{font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.xbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#faf6ee;border-radius:6px}
.xbox .lab{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.note{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-3)}
.also{align-self:flex-start;font-size:11px;font-weight:500;letter-spacing:.08em;color:#2f5d3f;background:#eef5ef;border:.5px solid #cfe2d3;padding:3px 10px;border-radius:12px}
.cares{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.care{display:flex;flex-direction:column;gap:10px;padding:20px;background:#f6efe0;border:.5px solid #e1d3b5;border-radius:8px}
.care h3{font-size:22px}
.care .chip{border-color:#d9c9a8;background:var(--paper)}
.began{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding:18px 22px;border:.5px solid var(--line);border-radius:8px;background:#fff}
.began .l{flex:0 0 210px;display:flex;flex-direction:column;gap:4px}
.began .l span{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#8f8577}
.began .r{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.method{padding:22px;border:.5px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px}
.method h2{margin:0;font-size:10px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.method p{margin:0;font-family:var(--serif);font-size:16px;line-height:1.65;color:var(--ink-2)}
/* states */
.state{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.star{font-size:28px;color:#b8955a}
.spin{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.state h2{margin:0;font-family:var(--serif);font-size:34px;font-weight:300}
.state p{margin:0;font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--ink);border:none;cursor:pointer;text-decoration:none}
.btn.gold{background:#b08f5c}
.btn:disabled{opacity:.5;cursor:wait}
.state input{width:100%;max-width:320px;padding:12px;font-family:var(--serif);font-size:17px;border:.5px solid #d9cfbd;background:#fff}
.err{color:#9b3535}
@media(max-width:560px){.place{flex-direction:column}.began .l{flex-basis:100%}}
</style>
</head>
<body>
<header class="hdr">
  <a class="wordmark" href="/">elsewhere</a>
  <a class="pill" href="/profile.html">← Your profile</a>
</header>
<main id="main">
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</main>

<script>
// ── Setup ─────────────────────────────────────────────────────────────────
var SB = supabase.createClient('https://wdulylmxhvlxhjfmfivu.supabase.co', 'sb_publishable_pBoHzlLsZiLAr7EYF824DA_R6pw5sdR');
var THEMES = ['love', 'career', 'home'];
var theme = (new URLSearchParams(location.search).get('theme') || 'love').toLowerCase();
if (THEMES.indexOf(theme) === -1) theme = 'love';

var T = {
  love:   { eyebrow: 'The love report', h1: 'Where <em>love</em> finds you', word: 'love',
            lede: 'The places where the planets behind your love life are strongest, and up to three where they ask more of you. Every report shows your seven strongest places, each in a different part of the world.',
            glance: 'Your love map at a glance', zone: 'Where love opens up', planets: 'Your love planets', best: 'Your best places for love',
            careIntro: 'Places where the hardest planets in your chart fall across love. These are the places where love is hardest to find and keep: best avoided.' },
  career: { eyebrow: 'The career report', h1: 'Where your <em>work</em> rises', word: 'career',
            lede: 'The places where the planets behind your career and money are strongest, and up to three where they ask more of you. Every report shows your seven strongest places, each in a different part of the world.',
            glance: 'Your career map at a glance', zone: 'Where your work is seen', planets: 'Your career planets', best: 'Your best places for career and money',
            careIntro: 'Places where the hardest planets in your chart fall across work and money. These are the places where recognition is hardest to build: best avoided.' },
  home:   { eyebrow: 'The home report', h1: 'Where you feel <em>at home</em>', word: 'home',
            lede: 'The places where the planets behind your home and roots are strongest, and up to three where they ask more of you. Every report shows your seven strongest places, each in a different part of the world.',
            glance: 'Your home map at a glance', zone: 'Where you settle', planets: 'Your home planets', best: 'Your best places to feel at home',
            careIntro: 'Places where the hardest planets in your chart fall across home and roots. These are the places where it is hardest to feel settled: best avoided.' }
}[theme];

// Planet glyphs and colours (from the mockup).
var G = { Sun:['☉︎','#a87a2c'], Moon:['☽︎','#4f6f9c'], Venus:['♀︎','#b0506b'], Jupiter:['♃︎','#7a5a30'], Neptune:['♆︎','#4a4a9a'], Saturn:['♄︎','#5f564b'],
          Mars:['♂︎','#9b3535'], Pluto:['♇︎','#7a4a6a'], Uranus:['♅︎','#3f7a86'], Mercury:['☿︎','#6b7a3a'], Chiron:['⚷','#5f7a5a'], NNode:['☊︎','#6b645b'] };
var VERDICT = { harmonious: ['Harmonious', '#2f5d3f', '#e2eee4'], dynamic: ['Dynamic', '#6e5226', '#f1e6cf'], challenging: ['Challenging', '#9b3535', '#f6e3df'] };
var LOOK = { helps: ['#2e2b28', '#b8955a', '#ffffff', '#2f5d3f'], caution: ['#2e2b28', '#c47b6c', '#fbf1ee', '#9b3535'], neutral: ['#6b645b', '#cfc4b0', '#f6f3ee', '#8f8577'] };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function key(p) { p = String(p || ''); return p === 'North Node' ? 'NNode' : p; }
function glyph(p) { var g = G[key(p)]; return g ? '<span class="g" aria-hidden="true" style="color:' + g[1] + '">' + g[0] + '</span>' : ''; }
// "Sun on the Descendant" / "North Node on the IC" → planet from the start of the label
function chipFromText(t) { var m = String(t).match(/^(North Node|\w+)/); return '<span class="chip">' + glyph(m ? m[1] : '') + esc(t) + '</span>'; }
function lineChip(l) { return '<span class="chip">' + glyph(l.planet) + esc(l.label) + '</span>'; }
function crossChip(x) {
  var k = LOOK[x.effect] || LOOK.neutral;
  return '<span class="cross" style="color:' + k[0] + ';border-color:' + k[1] + ';background:' + k[2] + '">' + glyph(x.p1) + '<span class="x">×</span>' + glyph(x.p2) +
    esc(x.label) + '<span class="t" style="color:' + k[3] + '">' + esc(x.effect === 'helps' ? 'helps' : x.effect === 'caution' ? 'caution' : 'neutral') + '</span></span>';
}
function secHead(t) { return '<div class="sec-h"><h2>' + esc(t) + '</h2><div></div></div>'; }
function view(html) { document.getElementById('view').innerHTML = html; }

// Tabs: Love / Career / Home
document.getElementById('tabs').innerHTML = THEMES.map(function (t) {
  return '<a class="tab' + (t === theme ? ' on' : '') + '" href="?theme=' + t + '">' + t.charAt(0).toUpperCase() + t.slice(1) + '</a>';
}).join('');
document.title = 'elsewhere — ' + T.eyebrow.replace('The ', 'your ');

// ── States ────────────────────────────────────────────────────────────────
function showPreparing(first) {
  view('<div class="state"><div class="star spin">✦</div><h2>' + (first ? 'Preparing your report' : 'Opening your report') + '</h2>' +
    '<p>' + (first ? 'We are reading your chart across more than 34,000 places. The first time takes about a minute; after that your report opens straight away.' : 'One moment…') + '</p></div>');
}
function showSignIn() {
  view('<div class="state"><div class="star">✦</div><h2>Sign in to read your report</h2>' +
    '<p>Enter the email you used when you bought it, and we will send you a link. No password needed.</p>' +
    '<input type="email" id="em" placeholder="your@email.com"><button class="btn" id="sb" onclick="sendLink()">Send my sign-in link</button><p id="sm" style="font-size:16px"></p></div>');
}
function sendLink() {
  var em = (document.getElementById('em').value || '').trim(), b = document.getElementById('sb'), m = document.getElementById('sm');
  if (em.indexOf('@') === -1) { m.className = 'err'; m.textContent = 'Please enter a valid email address.'; return; }
  b.disabled = true; b.textContent = 'Sending…';
  fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'send_magic_link', email: em }) })
    .then(function () { m.className = ''; m.textContent = 'Check your email for your sign-in link, then come back to this page.'; b.textContent = 'Link sent ✦'; })
    .catch(function () { m.className = 'err'; m.textContent = 'Something went wrong. Please try again.'; b.disabled = false; b.textContent = 'Send my sign-in link'; });
}
function showLocked() {
  view('<div class="state"><div class="star">✦</div><h2>' + T.h1 + '</h2>' +
    '<p>Your ' + T.word + ' report shows your seven strongest places in the world for ' + T.word + ', read from your own birth chart, and the places to avoid.</p>' +
    '<button class="btn" onclick="buy(\'report_' + theme + '\', this)">Get your ' + T.word + ' report · $22.22</button>' +
    '<button class="btn gold" onclick="buy(\'report_all\', this)">All three reports · $44.44</button><p id="bm" class="err"></p></div>');
}
async function buy(product, btn) {
  btn.disabled = true; btn.textContent = 'Opening checkout…';
  // Signed in here, so send the account email: the purchase is filed under
  // this account even if Apple Pay supplies a different email.
  var email = null;
  try { var s = (await SB.auth.getSession()).data.session; email = s && s.user && s.user.email; } catch (e) {}
  fetch('/api/create-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(email ? { product: product, email: email } : { product: product }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.url) location.href = d.url; else throw new Error(d && d.error || 'no checkout link'); })
    .catch(function (e) { document.getElementById('bm').textContent = 'Sorry, checkout could not open: ' + e.message; btn.disabled = false; btn.textContent = 'Try again'; });
}
function showNeedBirth(missing) {
  var what = missing && missing.time ? 'your birth time' : 'your birth details';
  view('<div class="state"><div class="star">✦</div><h2>We need ' + what + '</h2>' +
    '<p>Your report is read from your exact birth date, time and place. Add them on your profile, then come back to this page.</p>' +
    '<a class="btn" href="/profile.html">Go to your profile</a></div>');
}
function showError(msg) {
  view('<div class="state"><div class="star">✦</div><h2>Your report could not open</h2><p>Please try again in a moment. If it keeps happening, reply to your purchase email and we will sort it out.</p>' +
    '<p class="err" style="font-size:14px">' + esc(msg) + '</p><button class="btn" onclick="load()">Try again</button></div>');
}

// ── The report ────────────────────────────────────────────────────────────
function render(R) {
  var g = R.glance || {}, z = g.zone || {}, c = g.caution || {};
  var bp = R.birthplace || {};
  var bpTag = /Strong/.test(bp.verdict) ? ['#2f5d3f', '#e2eee4'] : /gentle/.test(bp.verdict) ? ['#2f5d3f', '#e2eee4'] : /Quiet/.test(bp.verdict) ? ['#4a4540', '#ece7de'] : ['#7a5418', '#f4e7cc'];
  var html = '';
  html += '<section class="title"><span class="eyebrow">' + esc(T.eyebrow) + '</span><h1>' + T.h1 + '</h1>' +
    '<p class="who">' + esc([R.name, R.birth].filter(Boolean).join(' · ')) + '</p><p class="lede">' + esc(T.lede) + '</p></section>';

  html += '<section class="sec">' + secHead(T.glance) + '<div class="grid2">' +
    '<article class="card"><span class="badge" style="color:#2f5d3f;background:#e2eee4">' + esc(T.zone) + '</span><h3>' + esc(z.title) + '</h3>' +
      '<div class="chips">' + (z.chips || []).map(chipFromText).join('') + '</div><p class="body">' + esc(z.text) + '</p></article>' +
    '<article class="card warm"><span class="badge" style="color:#7a5418;background:#f4e7cc">Your top lines</span><h3>' + esc(c.title) + '</h3>' +
      '<div class="chips">' + (c.chips || []).map(chipFromText).join('') + '</div><p class="body">' + esc(c.text) + '</p></article></div></section>';

  html += '<section class="sec"><div id="map"></div><div class="legend"><span><span class="dot" style="background:#1a1714"></span>Best places</span>' +
    '<span><span class="dot" style="background:#ebdfc6;border:1px solid #b8955a"></span>Places to avoid</span></div></section>';

  html += '<section class="sec">' + secHead(T.planets) +
    '<p class="body">How the planets that shape ' + esc(T.word) + ' are placed in your chart. This decides whether a planet\'s line lifts a place or makes it harder, the same verdicts as your Map Guide.</p>' +
    '<div class="planets">' + (R.planets || []).map(function (p) {
      var v = VERDICT[p.verdict] || VERDICT.dynamic;
      return '<div class="planet"><div class="nm">' + glyph(p.planet).replace('class="g"', 'class="g" style="font-size:22px"') + '<span>' + esc(p.name) + '</span></div>' +
        '<span class="pl">' + esc(p.place) + '</span><span class="badge" style="color:' + v[1] + ';background:' + v[2] + '">' + v[0] + '</span><span class="why">' + esc(p.why) + '</span></div>';
    }).join('') + '</div></section>';

  html += '<section class="sec">' + secHead(T.best) + (R.best || []).map(function (b) {
    var where = b.spot ? b.spot + ', ' + b.country : b.country;
    var x = (b.parans || []);
    return '<article class="place"><span class="rank">' + esc(b.rank) + '</span><div class="in">' +
      '<div class="top"><h3>' + esc(b.city) + '</h3><span class="ctry">' + esc(where) + '</span><span class="badge" style="color:#2f5d3f;background:#e2eee4">' + esc(b.tag) + '</span></div>' +
      ((b.lines || []).length ? '<div class="chips">' + b.lines.map(lineChip).join('') + '</div>' : '') +
      '<div class="xbox"><span class="lab">Crossings at this latitude</span>' +
        (x.length ? '<div class="chips">' + x.map(crossChip).join('') + '</div>' : '<span class="note">None of your planet pairs cross within 1.5° of this latitude.</span>') + '</div>' +
      (b.tagLine ? '<span class="also">' + esc(b.tagLine) + '</span>' : '') +
      '<p class="body">' + esc(b.text) + '</p>' +
      ((b.nearby || []).length ? '<span class="note">Also nearby: ' + esc(b.nearby.join(', ')) + '</span>' : '') +
      '</div></article>';
  }).join('') + '</section>';

  html += '<section class="sec">' + secHead('Places to avoid');
  if ((R.care || []).length) {
    html += '<p class="body">' + esc(T.careIntro) + '</p><div class="cares">' + R.care.map(function (k) {
      var where = k.spot ? k.spot + ', ' + k.country : k.country, x = k.parans || [];
      return '<article class="care"><div class="top" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px"><h3>' + esc(k.city) + '</h3><span class="ctry" style="font-size:12px;color:#4a4540">' + esc(where) + '</span></div>' +
        ((k.lines || []).length ? '<div class="chips">' + k.lines.map(lineChip).join('') + '</div>' : '') +
        '<div style="display:flex;flex-direction:column;gap:6px"><span class="lab" style="font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#8a6a35">Crossings</span>' +
        (x.length ? '<div class="chips">' + x.map(crossChip).join('') + '</div>' : '<span class="note" style="font-size:14px">None of your planet pairs cross near this latitude.</span>') + '</div>' +
        '<p class="body" style="font-size:16px;line-height:1.6">' + esc(k.text) + '</p></article>';
    }).join('') + '</div>';
  } else {
    html += '<p class="body">No place on your map comes out negative for ' + esc(T.word) + '. Where your harder planets fall, your stronger ones balance them out.</p>';
  }
  html += '</section>';

  html += '<section class="sec">' + secHead('Where you began') + '<p class="body">Your birthplace, read for ' + esc(T.word) + '.</p>' +
    '<div class="began"><div class="l"><h3 style="font-size:22px">' + esc(bp.city) + '</h3><span>' + esc(bp.why || 'Where you were born') + '</span></div>' +
    '<div class="r"><span class="badge" style="color:' + bpTag[0] + ';background:' + bpTag[1] + '">' + esc(bp.verdict) + '</span><p class="body">' + esc(bp.text) + '</p></div></div></section>';

  html += '<section class="method"><h2>How this was worked out</h2><p>' + esc(R.method) + '</p></section>';
  view(html);
  drawMap(R);
}

// Real map (the same MapTiler tiles as the site's map), with numbered pins.
function drawMap(R) {
  if (!window.L) return;
  var map = L.map('map', { scrollWheelZoom: false, worldCopyJump: true });
  L.tileLayer('https://api.maptiler.com/maps/streets-v4/256/{z}/{x}/{y}.png?key=WJmfJTxleU1h9uFM81oA', {
    maxZoom: 12, attribution: '© MapTiler © OpenStreetMap contributors' }).addTo(map);
  var pts = [];
  function add(lat, lng, mark, name, care) {
    if (lat == null || lng == null) return;
    var icon = L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
      html: '<div class="pin" style="background:' + (care ? '#ebdfc6' : '#1a1714') + ';color:' + (care ? '#6e5226' : '#faf8f4') + '">' + mark + '</div>' });
    L.marker([lat, lng], { icon: icon, title: name }).addTo(map).bindTooltip(name);
    pts.push([lat, lng]);
  }
  (R.best || []).forEach(function (b) { add(b.lat, b.lng, b.rank, b.city, false); });
  (R.care || []).forEach(function (k) { add(k.lat, k.lng, '!', k.city, true); });
  if (pts.length) map.fitBounds(pts, { padding: [36, 36], maxZoom: 5 }); else map.setView([20, 0], 2);
}

// ── Load ──────────────────────────────────────────────────────────────────
async function load() {
  showPreparing(false);
  var s = null;
  try { s = (await SB.auth.getSession()).data.session; } catch (e) { s = null; }
  if (!s) return showSignIn();
  var slow = setTimeout(function () { showPreparing(true); }, 2500);   // the saved copy opens in a second or two
  try {
    var r = await fetch('/api/generate-report', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token },
      body: JSON.stringify({ theme: theme }) });
    var j = null; try { j = await r.json(); } catch (e) { j = null; }
    clearTimeout(slow);
    if (r.ok && j && j.report) return render(j.report);
    if (r.status === 401) return showSignIn();
    if (r.status === 402) return showLocked();
    if (r.status === 422) return showNeedBirth(j && j.missing);
    return showError((j && j.error) || ('status ' + r.status));
  } catch (e) {
    clearTimeout(slow);
    showError(e.message);
  }
}
load();
</script>
