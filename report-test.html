<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>elsewhere — report checkout test</title>
<style>
  body { font-family: Georgia, serif; max-width: 520px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-weight: normal; }
  p.note { color: #777; font-size: 14px; }
  button { display: block; width: 100%; margin: 12px 0; padding: 14px; font-size: 16px;
           font-family: inherit; border: 1px solid #222; background: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: #b00; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Report checkout test</h1>
  <p class="note">Hidden test page — not linked anywhere. Sandbox only: use card 4242 4242 4242 4242.</p>

  <button onclick="buy('report_love', this)">Love report — $22.22</button>
  <button onclick="buy('report_career', this)">Career report — $22.22</button>
  <button onclick="buy('report_home', this)">Home report — $22.22</button>
  <button onclick="buy('report_all', this)">All three reports — $44.44</button>

  <div id="msg"></div>

<script>
// Same checkout call as the Map Guide button, but it names the product,
// so create-checkout.js charges the right price and labels the purchase.
function buy(product, btn) {
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Opening checkout…';
  document.getElementById('msg').textContent = '';
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ product: product })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (data && data.url) { window.location.href = data.url; return; }
    throw new Error((data && data.error) || 'No checkout link came back');
  })
  .catch(function (err) {
    btn.disabled = false; btn.textContent = label;
    document.getElementById('msg').textContent = 'Checkout failed: ' + err.message;
  });
}
</script>
</body>
</html>
