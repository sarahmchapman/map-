<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>elsewhere — report checkout test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: Georgia, serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1, h2 { font-weight: normal; }
  h2 { margin-top: 48px; }
  p.note { color: #777; font-size: 14px; }
  button { display: block; width: 100%; margin: 12px 0; padding: 14px; font-size: 16px;
           font-family: inherit; border: 1px solid #222; background: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: #b00; margin-top: 16px; }
  #out { white-space: pre-wrap; font-family: Menlo, monospace; font-size: 13px; background: #f6f4ef; padding: 14px; margin-top: 16px; display: none; }
</style>
</head>
<body>
  <h1>Report checkout test</h1>
  <p class="note">Hidden test page — not linked anywhere.</p>

  <button onclick="buy('report_love', this)">Love report — $22.22</button>
  <button onclick="buy('report_career', this)">Career report — $22.22</button>
  <button onclick="buy('report_home', this)">Home report — $22.22</button>
  <button onclick="buy('report_all', this)">All three reports — $44.44</button>

  <div id="msg"></div>

  <h2>Generate a report</h2>
  <p class="note">Uses your sign-in on this browser. You must have bought that report (or all three). The first time takes up to a minute; after that it loads the saved copy.</p>
  <button onclick="gen('love', this)">Generate my Love report</button>
  <button onclick="gen('career', this)">Generate my Career report</button>
  <button onclick="gen('home', this)">Generate my Home report</button>
  <div id="out"></div>

<script>
// Same checkout call as the Map Guide button, but it names the product,
// so create-checkout.js charges the right price and labels the purchase.
function buy(product, btn) {
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Opening checkout…';
  document.getElementById('msg').textContent = '';
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ product: product })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (data && data.url) { window.location.href = data.url; return; }
    throw new Error((data && data.error) || 'No checkout link came back');
  })
  .catch(function (err) {
    btn.disabled = false; btn.textContent = label;
    document.getElementById('msg').textContent = 'Checkout failed: ' + err.message;
  });
}

// Same Supabase project and public key as report.html.
var _sb = supabase.createClient(
  'https://wdulylmxhvlxhjfmfivu.supabase.co',
  'sb_publishable_pBoHzlLsZiLAr7EYF824DA_R6pw5sdR'
);

async function gen(theme, btn) {
  var out = document.getElementById('out'), label = btn.textContent, t0 = Date.now();
  out.style.display = 'block'; out.textContent = 'Working… (up to a minute the first time)';
  btn.disabled = true; btn.textContent = 'Generating…';
  try {
    var s = (await _sb.auth.getSession()).data.session;
    if (!s) { out.textContent = 'Not signed in on this browser. Sign in on the site first (magic link), then come back.'; return; }
    var r = await fetch('/api/generate-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token },
      body: JSON.stringify({ theme: theme })
    });
    var j = await r.json();
    var secs = ((Date.now() - t0) / 1000).toFixed(1) + ' s';
    if (!r.ok) { out.textContent = 'Status ' + r.status + ' after ' + secs + '\n' + JSON.stringify(j, null, 2); return; }
    var rep = j.report;
    out.textContent =
      (j.cached ? 'Loaded the saved report' : 'Generated') + ' in ' + secs +
      (j.timing ? ' (chart ' + (j.timing.chartMs / 1000).toFixed(1) + ' s, engine ' + (j.timing.engineMs / 1000).toFixed(1) + ' s)' : '') + '\n\n' +
      theme.toUpperCase() + ' — ' + rep.name + '\n' + rep.birth + '\n\nBest places:\n' +
      rep.best.map(function (c) { return '  ' + c.rank + '. ' + c.city + ', ' + c.country + '  (' + c.tag + ')'; }).join('\n') +
      '\n\nPlaces to avoid:\n' + (rep.care.length ? rep.care.map(function (c) { return '  ' + c.city + ', ' + c.country; }).join('\n') : '  none');
  } catch (e) {
    out.textContent = 'Failed: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}
</script>
</body>
</html>
